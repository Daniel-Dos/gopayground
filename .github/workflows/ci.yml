# CI — Pipeline de integração contínua
# Executa lint, testes e build em qualquer push (não master/develop)
name: CI
on:
  push:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --config=.golangci-lint.yaml

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build build-ui build-producer

  auto-pr:
    needs: build
    if: github.ref_name != 'master' && github.ref_name != 'develop' && !contains(github.ref_name, '/merge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract branch type prefix
        id: prefix
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" == feature/* ]]; then
            echo "prefix=feature" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == release/* ]]; then
            echo "prefix=release" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "prefix=hotfix" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=change" >> "$GITHUB_OUTPUT"
          fi
      - name: Create PR if not exists
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"
          echo "Prefix: $PREFIX"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "PR ja existe (#$PR_NUM) — nenhuma acao necessaria."
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PR aberto encontrado. Criando PR..."
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            BRANCH_NAME="${BRANCH#*/}"
            TITLE="[$PREFIX] $BRANCH_NAME ($SHORT_SHA)"

            git fetch origin develop 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only origin/develop...HEAD 2>/dev/null || echo "N/A")
            COMMIT_LOG=$(git log origin/develop...HEAD --oneline --no-decorate 2>/dev/null || echo "N/A")

            {
              echo "## Descricao"
              echo ""
              echo "PR automatico gerado apos pipeline CI."
              echo ""
              echo "### Alteracoes"
              echo "\`\`\`"
              echo "$COMMIT_LOG"
              echo "\`\`\`"
              echo ""
              echo "### Arquivos modificados"
              echo "\`\`\`"
              echo "$CHANGED_FILES"
              echo "\`\`\`"
              echo ""
              echo "### CI"
              echo "- [x] Lint (golangci-lint)"
              echo "- [x] Testes (make test)"
              echo "- [x] Build (make build)"
              echo ""
              echo "---"
              echo "> Comente \`/oc review\` neste PR para revisao automatizada."
            } > /tmp/pr_body.md

            PR_URL=$(gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/pr_body.md)
            PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
            echo "PR criado: #$PR_NUM"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi



