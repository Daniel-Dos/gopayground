# CI — Pipeline de integração contínua
# Executa lint, testes e build em qualquer push (exceto master)
name: CI
on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --config=.golangci-lint.yaml

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build build-ui build-producer

  auto-pr:
    needs: build
    if: github.ref_name != 'master' && github.ref_name != 'develop' && !contains(github.ref_name, '/merge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract branch type prefix
        id: prefix
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" == feature/* ]]; then
            echo "prefix=feature" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == release/* ]]; then
            echo "prefix=release" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "prefix=hotfix" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=change" >> "$GITHUB_OUTPUT"
          fi
      - name: Create PR if not exists
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"
          echo "Prefix: $PREFIX"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "PR ja existe (#$PR_NUM) — nenhuma acao necessaria."
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PR aberto encontrado. Criando PR..."
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            BRANCH_NAME="${BRANCH#*/}"
            TITLE="[$PREFIX] $BRANCH_NAME ($SHORT_SHA)"

            git fetch origin develop 2>/dev/null || true

            FILES_STATS=$(git diff --stat origin/develop...HEAD 2>/dev/null || echo "")
            if [ -z "$FILES_STATS" ]; then
              FILES_STATS="Nenhum arquivo alterado (ja sincronizado com develop)"
            fi

            COMMITS=$(git log origin/develop..HEAD --oneline --no-decorate 2>/dev/null || echo "")
            if [ -z "$COMMITS" ]; then
              COMMITS="Nenhum commit novo"
            fi

            SUMMARY=$(git log origin/develop..HEAD --format="- %s" 2>/dev/null || echo "")
            if [ -z "$SUMMARY" ]; then
              SUMMARY="- Nenhuma alteracao nova"
            fi

            # --- Constroi o body do PR usando o template oficial ---
            TEMPLATE=$(cat .github/PULL_REQUEST_TEMPLATE.md)

            # Preenche a descricao com o summary dos commits
            DESCRICAO="$SUMMARY"
            BODY="${TEMPLATE/<!-- Descreva o que este PR altera e por que -->/$DESCRICAO}"

            # Marca o tipo de mudanca conforme o prefixo da branch
            case "$PREFIX" in
              feature) BODY="${BODY/- [ ] ✨ Feature/- [x] ✨ Feature}" ;;
              fix|bugfix|hotfix) BODY="${BODY/- [ ] 🐛 Bugfix/- [x] 🐛 Bugfix}" ;;
              release) BODY="${BODY/- [ ] ✨ Feature/- [x] ✨ Feature}" ;;
              refactor) BODY="${BODY/- [ ] 🔧 Refactor/- [x] 🔧 Refactor}" ;;
              docs|doc) BODY="${BODY/- [ ] 📚 Documentação/- [x] 📚 Documentação}" ;;
              perf) BODY="${BODY/- [ ] ⚡ Performance/- [x] ⚡ Performance}" ;;
              test|tests) BODY="${BODY/- [ ] 🧪 Testes/- [x] 🧪 Testes}" ;;
              security|sec) BODY="${BODY/- [ ] 🔒 Segurança/- [x] 🔒 Segurança}" ;;
              chore|ci) BODY="${BODY/- [ ] 🤖 CI\/CD/- [x] 🤖 CI/CD}" ;;
            esac

            # Preenche "Como testar" com passos basicos
            FILES_LIST=$(git diff --name-only origin/develop...HEAD 2>/dev/null | head -5 | paste -sd, -)
            BODY="${BODY/1./1. CI passar (lint, test, build) - verificar status abaixo}"
            BODY="${BODY/2./2. Revisar alteracoes em: $FILES_LIST}"
            BODY="${BODY/3./3. Executar \`make test\` e \`make build\` localmente}"

            # Preenche "Observacoes" com o resumo dos commits e CI
            OBS="**Commits:**
\`\`\`
$COMMITS
\`\`\`

**Arquivos alterados:**
\`\`\`
$FILES_STATS
\`\`\`

**CI:** ✅ Lint (golangci-lint) | ✅ Testes (make test) | ✅ Build (make build)

---

> Para revisao automatizada, comente \`/oc review\` neste PR."
            BODY="${BODY/<!-- Informações adicionais que o revisor precisa saber -->/$OBS}"

            printf '%s\n' "$BODY" > /tmp/pr_body.md

            PR_URL=$(gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/pr_body.md)
            PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
            echo "PR criado: #$PR_NUM"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi



