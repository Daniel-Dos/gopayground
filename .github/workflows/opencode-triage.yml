# Issue Triage — Triagem automática de novas issues com OpenCode
# Opcional: filtra contas com menos de 30 dias e tria com IA
name: Issue Triage
on:
  issues:
    types: [opened]

jobs:
  check-account-age:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            try {
              const user = await github.rest.users.getByUsername({
                username: context.payload.issue.user.login
              });
              const created = new Date(user.data.created_at);
              const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
              core.setOutput('result', days >= 30 ? 'true' : 'false');
            } catch (error) {
              console.log('Erro ao verificar usuário, permitindo triagem:', error.message);
              core.setOutput('result', 'true');
            }
          result-encoding: string

  triage:
    needs: check-account-age
    if: needs.check-account-age.outputs.result == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Revise esta issue para o projeto gopayground.
            - Se houver documentação relevante, mencione links.
            - Se for um bug claro, sugira possíveis causas e soluções.
            - Se for um pedido de feature, avalie a complexidade.
            - Caso contrário, não comente.
