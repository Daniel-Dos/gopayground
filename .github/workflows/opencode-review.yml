# OpenCode Review — Revisao automatizada de Pull Requests
# Conforme doc: https://opencode.ai/docs/pt-br/github/#exemplo-de-pull-request
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Revise este pull request (Go 1.26):
            - Verifique qualidade do codigo Go
            - Procure por potenciais bugs
            - Sugira melhorias
