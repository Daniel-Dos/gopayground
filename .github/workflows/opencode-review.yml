# OpenCode Review — Revisao automatizada de Pull Requests
# Executa OpenCode review quando um PR e aberto ou atualizado
name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.base.ref == 'develop'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Voce e um revisor de codigo Go para o projeto gopayground.

            Revise APENAS as linhas alteradas neste PR (diff). Nao revise o codigo todo.
            - Qualidade do codigo Go (idiomatico, erros com fmt.Errorf, context.Context)
            - Testes acompanham as alteracoes?
            - Tratamento de erros e timeouts
            - Logs estruturados nos pontos criticos
            - Seguranca basica (vazamento de informacao, injecao)

            Classifique cada problema como:
            - BLOQUEADOR: impede o merge (bug, seguranca)
            - ATENCAO: deve ser corrigido
            - SUGESTAO: melhoria opcional

            Se nao houver BLOQUEADORES, aprove o PR no final.
            Se houver BLOQUEADORES, NAO aprove — liste-os claramente.
            Poste o resumo como comentario no PR.

      - name: Approve PR after successful review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            gh pr review "$PR_NUMBER" --approve --body "✅ Revisao OpenCode concluida sem bloqueadores. Aprovado."
            echo "PR #$PR_NUMBER aprovado via OpenCode review."
          fi
