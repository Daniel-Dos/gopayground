# Auto-PR to Master — Cria PR automaticamente para master quando
# um PR de release/* ou hotfix/* é mergeado em develop
name: Auto-PR to Master

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  create-master-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check branch type
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Branch de origem: $HEAD_REF"

          if [[ "$HEAD_REF" == release/* ]]; then
            PREFIX="release"
            VERSION="${HEAD_REF#release/}"
            TITLE="[release] v$VERSION"
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "Disparando: release $VERSION -> master"
          elif [[ "$HEAD_REF" == hotfix/* ]]; then
            PREFIX="hotfix"
            DESC="${HEAD_REF#hotfix/}"
            TITLE="[hotfix] $DESC"
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
            echo "version=$DESC" >> "$GITHUB_OUTPUT"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "Disparando: hotfix $DESC -> master"
          else
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "Branch '$HEAD_REF' ignorada (nao e release/* ou hotfix/*)."
          fi

      - name: Check for existing PR to master
        id: existing
        if: steps.check.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Verificando se ja existe PR aberto de $HEAD_REF para master..."
          EXISTING_PR=$(gh pr list \
            --head "$HEAD_REF" \
            --base master \
            --state open \
            --json number,title \
            --jq '.[0] // empty' \
            2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            PR_NUM=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_TITLE=$(echo "$EXISTING_PR" | jq -r '.title')
            echo "PR ja existe: #$PR_NUM - $PR_TITLE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PR existente encontrado. Criando novo PR..."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PR body
        id: body
        if: steps.check.outputs.trigger == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_SRC: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE_SRC: ${{ github.event.pull_request.title }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PREFIX: ${{ steps.check.outputs.prefix }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          REPO="${{ github.repository }}"

          COMMITS_JSON=$(gh pr view "$PR_NUMBER_SRC" \
            --repo "$REPO" \
            --json commits 2>/dev/null || echo '{"commits":[]}')

          CHANGELOG=$(echo "$COMMITS_JSON" | jq -r '.commits[] | "- \(.messageHeadline) (\(.oid[0:7]))"' 2>/dev/null || echo "N/A")

          FILES_JSON=$(gh pr view "$PR_NUMBER_SRC" \
            --repo "$REPO" \
            --json files 2>/dev/null || echo '{"files":[]}')

          FILES_CHANGED=$(echo "$FILES_JSON" | jq -r '.files[] | "- \(.path) (\(.additions) adicoes, \(.deletions) remocoes)"' 2>/dev/null || echo "N/A")

          {
            echo "## 🤖 PR gerado automaticamente para master"
            echo ""
            echo "Este PR foi criado automaticamente apos o merge do PR #${PR_NUMBER_SRC} em develop."
            echo ""
            echo "### Origem"
            echo ""
            echo "| Item | Detalhe |"
            echo "|------|---------|"
            echo "| **Tipo** | $PREFIX |"
            echo "| **Branch de origem** | $HEAD_REF |"
            echo "| **Merge commit** | $MERGE_COMMIT |"
            echo "| **Merge realizado em** | $MERGED_AT |"
            echo "| **PR original** | #${PR_NUMBER_SRC} - $PR_TITLE_SRC |"
            echo ""
            echo "### Changelog (commits do PR original)"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "### Arquivos alterados"
            echo ""
            echo "$FILES_CHANGED"
            echo ""
            echo "### Revisao necessaria"
            echo ""
            echo ":warning: Este PR precisa ser revisado e aprovado antes do merge em master."
            echo "O CI ja foi executado na branch de origem (PR #${PR_NUMBER_SRC})."
            echo ""
            echo "---"
            echo ""
            echo "*PR gerado automaticamente pelo workflow Auto-PR to Master.*"
          } > /tmp/pr_body_master.md

          echo "body_file=/tmp/pr_body_master.md" >> "$GITHUB_OUTPUT"

      - name: Create PR to master
        id: create
        if: steps.check.outputs.trigger == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          echo "Criando PR para master..."
          echo "Titulo: $TITLE"
          echo "Branch: $HEAD_REF -> master"

          PR_URL=$(gh pr create \
            --base master \
            --head "$HEAD_REF" \
            --title "$TITLE" \
            --body-file "${{ steps.body.outputs.body_file }}" \
            2>&1)

          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Falha ao criar PR para master."
            echo "Erro: $PR_URL"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$' || echo "unknown")
          echo "PR criado: $PR_URL"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Log summary
        if: always()
        env:
          TRIGGER: ${{ steps.check.outputs.trigger }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXISTING_PR: ${{ steps.existing.outputs.exists }}
          NEW_PR: ${{ steps.create.outputs.created }}
          NEW_PR_URL: ${{ steps.create.outputs.pr_url }}
          EXISTING_PR_NUM: ${{ steps.existing.outputs.pr_number }}
        run: |
          echo "=========================================="
          echo "Resumo do Auto-PR para Master"
          echo "=========================================="
          echo "Branch de origem: $HEAD_REF"
          echo "Disparou PR? $TRIGGER"

          if [ "$TRIGGER" == "true" ]; then
            if [ "$EXISTING_PR" == "true" ]; then
              echo "Resultado: PR ja existia (#$EXISTING_PR_NUM) — nenhuma acao necessaria."
            elif [ "$NEW_PR" == "true" ]; then
              echo "Resultado: PR criado com sucesso: $NEW_PR_URL"
            else
              echo "Resultado: Falha ao criar PR (ver logs acima)."
            fi
          else
            echo "Resultado: Branch ignorada (nao e release/* ou hotfix/*)."
          fi
          echo "=========================================="
