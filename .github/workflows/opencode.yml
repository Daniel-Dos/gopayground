name: opencode

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, ' /run') ||
      startsWith(github.event.comment.body, '/run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Extrai arquivos alterados usando tj-actions e passa a lista no prompt
      # para o OpenCode focar apenas nos arquivos relevantes do PR
      - name: Get changed files
        id: changed-files
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'pull_request_review_comment' && github.event.pull_request)
        uses: tj-actions/changed-files@v46
        continue-on-error: true

      - name: Prepare prompt
        id: prompt
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            FILES="${{ steps.changed-files.outputs.all_changed_files }}"
            echo "prompt<<OPROMPT_END" >> $GITHUB_OUTPUT
            echo "Revise este Pull Request. Os arquivos alterados sao:" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            for f in $FILES; do
              echo "- $f" >> $GITHUB_OUTPUT
            done
            echo "" >> $GITHUB_OUTPUT
            echo "Analise cada arquivo alterado listado acima e forneca sugestoes de melhoria." >> $GITHUB_OUTPUT
            echo "OPROMPT_END" >> $GITHUB_OUTPUT
          else
            echo "prompt<<OPROMPT_END" >> $GITHUB_OUTPUT
            echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
            echo "OPROMPT_END" >> $GITHUB_OUTPUT
          fi

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: ${{ steps.prompt.outputs.prompt }}
