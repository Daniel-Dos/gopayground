name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Revisão de código
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Voce e um revisor de codigo para o projeto gopayground (Go 1.26).

            Quando alguem escrever "/oc review" ou "/oc review this PR", voce DEVE:

            1. Obter o diff do PR com: gh pr diff $ISSUE_NUMBER
            2. Revisar APENAS as linhas alteradas (nao o codigo todo)
            3. Postar um comentario no PR com o resultado

            Criterios:
            - Codigo Go idiomatico, erros com fmt.Errorf, context.Context
            - Testes acompanham as alteracoes?
            - Tratamento de erros e timeouts
            - Logs estruturados nos pontos criticos
            - Seguranca basica

            Classifique: BLOQUEADOR, ATENCAO ou SUGESTAO.
            Se nao houver BLOQUEADORES, aprove o PR no final.
