<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <!--
    GoPayground Logo

    Icon meaning:
    - Hexagon rim → Go language identity
    - 6 gear-tooth nodes → distributed system, Kafka cluster
    - Inner dashed hexagon → event streaming / partitioning
    - Payment card outline + chip → payment processing domain
    - Gold arrow through card → event flow through the payment pipeline
    - 3 nodes on the arrow → Kafka → processing → output stages
    - Connected remote nodes (dashed lines) → distributed infrastructure
  -->

  <!-- ===== ICON MARK ===== -->
  <g>
    <!-- Gear teeth at hexagon vertices (distributed nodes) -->
    <circle cx="93" cy="82" r="5" fill="#1a365d"/>
    <circle cx="55" cy="104" r="5" fill="#1a365d"/>
    <circle cx="17" cy="82" r="5" fill="#1a365d"/>
    <circle cx="17" cy="38" r="5" fill="#1a365d"/>
    <circle cx="55" cy="16" r="5" fill="#1a365d"/>
    <circle cx="93" cy="38" r="5" fill="#1a365d"/>

    <!-- Outer hexagon border (Go + structure) -->
    <polygon points="93,82 55,104 17,82 17,38 55,16 93,38" fill="none" stroke="#1a365d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner dashed hexagon (event partitioning / gear detail) -->
    <polygon points="85,76 55,94 25,76 25,44 55,26 85,44" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>

    <!-- Payment card outline -->
    <rect x="36" y="48" width="38" height="24" rx="3" fill="none" stroke="#1a365d" stroke-width="2"/>

    <!-- Card chip (gold accent) -->
    <rect x="40" y="52" width="9" height="7" rx="1.5" fill="#d69e2e"/>

    <!-- Event flow arrow through the card -->
    <line x1="26" y1="60" x2="76" y2="60" stroke="#d69e2e" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="70,54 80,60 70,66" fill="#d69e2e"/>

    <!-- Processing nodes along the arrow -->
    <circle cx="43" cy="60" r="3" fill="#2b6cb0"/>
    <circle cx="55" cy="60" r="3" fill="#1a365d"/>
    <circle cx="67" cy="60" r="3" fill="#2b6cb0"/>
  </g>

  <!-- ===== DISTRIBUTED CONNECTIONS ===== -->
  <!-- Top node → remote system -->
  <line x1="55" y1="16" x2="55" y2="3" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="55" cy="3" r="3" fill="#2b6cb0"/>

  <!-- Right node → remote system -->
  <line x1="93" y1="38" x2="106" y2="38" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="106" cy="38" r="3" fill="#2b6cb0"/>

  <!-- Left node → remote system -->
  <line x1="17" y1="82" x2="4" y2="82" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="4" cy="82" r="3" fill="#2b6cb0"/>

  <!-- ===== WORDMARK ===== -->
  <g font-family="'-apple-system','BlinkMacSystemFont','Segoe UI','Helvetica Neue','Inter',system-ui,sans-serif">
    <!-- Main title: "Go" in gold accent, "Payground" in deep navy -->
    <text x="125" y="54" font-size="36" letter-spacing="-0.5">
      <tspan font-weight="700" fill="#d69e2e">Go</tspan><tspan font-weight="600" fill="#1a365d">Payground</tspan>
    </text>

    <!-- Tagline -->
    <text x="126" y="77" font-size="10" font-weight="600" fill="#718096" letter-spacing="1.8">DISTRIBUTED PAYMENT PROCESSING</text>

    <!-- Bottom decorative line -->
    <line x1="126" y1="85" x2="350" y2="85" stroke="#d69e2e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="126" y1="87" x2="280" y2="87" stroke="#2b6cb0" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
