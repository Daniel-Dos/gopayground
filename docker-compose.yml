version: "3.8"

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: abcdefghijklmnopqrstuv
      # Listeners
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
    networks:
      - payment-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - payment-network

  floci:
    image: floci/floci:1.5.19
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_HOSTNAME: floci
    restart: unless-stopped
    networks:
      - payment-network

  otel-collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.otel-collector
    ports:
      - "4317:4317"  # OTLP gRPC — usado pelas aplicações para enviar traces/metrics
      - "4318:4318"  # OTLP HTTP — alternativa REST para envio de telemetria
      - "8888:8888"  # Internal metrics do collector (Prometheus format, via telemetry config)
      - "13133:13133"  # Health check endpoint (HTTP)
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - payment-network

  # ==========================================================================
  # Application Services
  # ==========================================================================

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    ports:
      - "8080:8080"
    environment:
      # Kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: payment.events
      KAFKA_DLQ_TOPIC: payment.events.dlq
      KAFKA_CONSUMER_GROUP: payment-consumer-group
      # Redis
      REDIS_ADDR: redis:6379
      # DynamoDB / AWS (static credentials for local Floci)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://floci:4566
      DYNAMODB_TABLE: payment_history
      # OpenTelemetry
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: payment-consumer
      # Worker pool
      WORKER_COUNT: 10
      # Retry configuration
      RETRY_MAX_ATTEMPTS: 3
      RETRY_BASE_DELAY_MS: 100
      # Idempotency & TTL
      IDEMPOTENCY_TTL_HOURS: 24
      STATUS_TTL_HOURS: 168
      # Shutdown
      GRACEFUL_SHUTDOWN_TIMEOUT: 30s
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      floci:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8080/healthz -O /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - payment-network

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    command: ["serve", "--brokers", "kafka:9092"]
    ports:
      - "8082:8082"
    environment:
      # Override default broker via environment (also supported by flag parsing)
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: payment.events
      # OpenTelemetry
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: payment-producer
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8082/healthz -O /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - payment-network

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8081:8081"
    environment:
      UI_PORT: 8081
      UI_PRODUCER_URL: http://producer:8082
      REDIS_ADDR: redis:6379
      # DynamoDB / AWS (static credentials for local Floci)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://floci:4566
      DYNAMODB_TABLE: payment_history
      # OpenTelemetry
      OTEL_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: payment-ui
    depends_on:
      redis:
        condition: service_started
      floci:
        condition: service_started
      kafka:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8081/healthz -O /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - payment-network

# ==========================================================================
# Networking 
# ==========================================================================

networks:
  payment-network:
    driver: bridge
