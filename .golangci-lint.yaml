# Configuração do golangci-lint
# Documentação: https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  default: standard
  disable:
    - errcheck
  exclusions:
    rules:
      # Exclui warnings específicos do staticcheck
      - linters:
          - staticcheck
        text: "SA1019:"
      - linters:
          - staticcheck
        text: "S1008:"
      # Exclui variáveis não utilizadas (serão limpas gradualmente)
      - linters:
          - unused
        text: "is unused"

formatters:
  enable:
    - gofmt
    - goimports
