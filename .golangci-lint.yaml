# Configuração do golangci-lint
# Documentação: https://golangci-lint.run/
version: "2"

linters:
  default: standard
  disable:
    - errcheck

issues:
  exclude:
    - "Error return value of .* is not checked"
    - "SA1019:" # deprecated API usage
    - "S1008:"  # simplify if/return
    - "is unused" # unused variable

formatters:
  enable:
    - gofmt
    - goimports
